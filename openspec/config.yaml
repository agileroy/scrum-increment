schema: spec-driven

# Project context: constraints an agent cannot infer from the code.
context: |
  Rédiger tous les artefacts OpenSpec (proposal, design, specs, tasks) en français.
  Jeu de formation Scrum « Fournée » : faire vivre la valeur de l'incrément (Increment) par une simulation.
  Madame Lefèvre, boulangère de quartier, fait développer une appli de commande en ligne, avec un budget de
  6 Sprints. Les joueurs ordonnent les fonctionnalités et lancent les Sprints ; chaque fonctionnalité a une
  « intuition » visible (ce que croit Mme Lefèvre) et une valeur réelle cachée (les ventes qu'elle génère).
  Deux façons de livrer sont comparées : une seule livraison à la fin (plan figé au départ, recette et mise en
  production finales) et un incrément utilisable à chaque Sprint (Product Backlog réordonnable, Sprint Review
  avec retours clients qui révèlent la valeur réelle). Les mêmes imprévus frappent les deux : concurrent,
  coupure budgétaire systématique et sans préavis (à la fin de la cinquième période, tout s'arrête en l'état ;
  rien ne l'annonce avant), et trois demandes de changement de Mme Lefèvre (en manche 1 : accepter par
  avenant en retirant des fonctionnalités, budget fixe, ou refuser ; en manche 2 : ajout au Product Backlog).
  Calendrier : un Sprint dure 2 semaines ; après le développement, on parle de semaines d'exploitation, jamais
  de Sprints, jusqu'à 20 semaines après le lancement. La fin du projet est la même pour les deux manches.
  La fin compare les courbes de ventes cumulées et des indicateurs, puis guide le débrief.
  Mécanique volontairement sans cartes : les jeux frères roles-responsabilites et scrum-events en utilisent déjà.
  En séance collective, la comparaison reste cachée aux participants jusqu'à la fin : chaque équipe croit
  travailler sur le même projet que les autres.
  Le moteur est déterministe (aucun tirage au hasard) : les chiffres du scénario sont réglés pour que les courbes
  racontent l'histoire, et les parcours de référence sont figés dans les tests.
  Vocabulaire de la traduction française officielle du Scrum Guide 2020 (novembre 2020) : Product Owner,
  Scrum Master, Developers, Scrum Team, Product Backlog, Sprint Review, Definition of Done, Increment ;
  termes gardés en anglais : Product Goal, Sprint Goal, refinement (du Product Backlog).
  Hébergement : site statique sur GitHub Pages (https://agileroy.github.io/scrum-increment/), sans serveur.
  Deux façons de jouer : seul (les deux manches à la suite), ou en mode collectif sur le modèle des jeux frères :
  formateur sur écran projeté, participants sur téléphone avec code de salle ou QR code, 2 à 6 équipes jouant en
  parallèle (impaires « projet », paires « Scrum », sans le savoir), chaque membre agissant sur l'état partagé
  de son équipe. Le formateur donne le tempo (chrono facultatif, période lancée pour toutes les équipes en même
  temps) et son écran reste neutre jusqu'à la révélation. Le mode démo (?demo) joue le mode collectif sans
  Firebase, sur une base locale partagée entre onglets. Temps réel : Firebase Realtime Database (offre
  gratuite, connexion anonyme) dans un projet Firebase dédié au jeu (aucun autre outil ne l'utilise) ;
  database.rules.json ne contient que la branche incrementGame et est publié automatiquement par GitHub Actions
  après les tests (secret FIREBASE_SERVICE_ACCOUNT). L'état de partie est donc fait d'objets JSON simples, sérialisables tels quels.
  Firebase n'est chargé qu'en mode collectif ; le jeu seul ne charge rien d'externe. Aucun autre service tiers
  (ni police web, ni CDN, ni traceur, ni publicité). N'utiliser que HTTPS (port 443).
  Le VPN de l'entreprise (proxy Zscaler) bloque GitHub Pages et Firebase : le jeu se joue hors VPN.
  Stack : HTML/CSS/JavaScript vanilla en modules ES, sans framework ni étape de build (dossier site/).
  Identité visuelle des jeux frères : mêmes couleurs de base, polices système, thème clair et sombre avec
  bouton de bascule mémorisé.
  Architecture : site/js/scenario.js contient les données du scénario ; site/js/game-core.js la logique métier
  pure (sans DOM), testée avec Node.js ; site/js/ui.js gère l'interface ; room-core.js, room-store.js et
  room-ui.js le mode collectif.
  Interface en français, sans compte.
  Tests : lanceur intégré de Node.js (npm test), à faire évoluer avec chaque changement de comportement ;
  la publication GitHub Actions est bloquée si un test échoue.
